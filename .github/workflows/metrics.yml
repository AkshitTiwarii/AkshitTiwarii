name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Main Dashboard Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AkshitTiwarii
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          
          # Base Header & Profile Stats
          base: header, activity, community, repositories, metadata
          
          # 1. 3D Isometric Contribution Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 2. Languages Breakdown (FIXED INVALID INPUT)
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_load: 400
          plugin_languages_recent_days: 14

          # 3. Coding Habits & Commits Activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 4. Starred Topics Grid (Tech Stack Icons)
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons

          # 5. Discussions Activity
          plugin_discussions: yes

          # 6. Achievements (FIXED TO EXCLUDE DEPRECATED PROJECTS)
          plugin_achievements: yes
          plugin_achievements_only: polyglot, stargazer, sponsor, deployer, member, maintainer, developer, scripter, packager, explorer, infographile
          plugin_achievements_display: compact

          # 7. Fortune Cookie (You can set plugin_fortune: no if you don't want bad luck rolls!)
          plugin_fortune: yes
