name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AkshitTiwarii
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # 1. PageSpeed Insights Widget (Top Right)
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://github.com/AkshitTiwarii

          # 2. 3D Isometric Contribution Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 3. Coding Habits & Activity Charts (Middle Left)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 4. Mastered Technologies & Icons Bar
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons

          # 5. Language Breakdown Bar (Bottom Right)
          plugin_languages: yes
          plugin_languages_analysis_target: activity
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # 6. Music / Apple Music Widget
          plugin_music: yes
          plugin_music_provider: apple
          plugin_music_mode: playlist
          plugin_music_playlist: https://embed.music.apple.com/us/playlist/storyteller/pl.pm-8422119bb9e4b78912e796061176bfeb

          # 7. Projects / Roadmap Tracker Widget (Bottom Right)
          plugin_projects: yes
          plugin_projects_limit: 2
